<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Choosing a top coat</text>
  <g font-size="14" text-anchor="middle">
    <rect x="280" y="48" width="200" height="44" rx="22" fill="#e8e4da" stroke="#999"/>
    <text x="380" y="75" font-weight="bold">Finished model</text>
    <!-- question 1 -->
    <rect x="250" y="116" width="260" height="44" rx="6" fill="#fff6d6" stroke="#c9a66b"/>
    <text x="380" y="143">Lexan RC body?</text>
    <rect x="560" y="116" width="180" height="44" rx="6" fill="#f2e6e6" stroke="#c0392b"/>
    <text x="650" y="136">No clear needed:</text><text x="650" y="152">the shell is the gloss</text>
    <!-- question 2 -->
    <rect x="250" y="186" width="260" height="44" rx="6" fill="#fff6d6" stroke="#c9a66b"/>
    <text x="380" y="206">Handled, outdoors,</text><text x="380" y="222">or a game piece / prop?</text>
    <rect x="560" y="186" width="180" height="44" rx="6" fill="#cfd8c0" stroke="#5b7a3a"/>
    <text x="650" y="206">Lacquer or 2K clear;</text><text x="650" y="222">UV-resistant outdoors</text>
    <!-- question 3 -->
    <rect x="250" y="256" width="260" height="44" rx="6" fill="#fff6d6" stroke="#c9a66b"/>
    <text x="380" y="276">Enamel / oil weathering</text><text x="380" y="292">underneath?</text>
    <rect x="560" y="256" width="180" height="44" rx="6" fill="#cfd8c0" stroke="#5b7a3a"/>
    <text x="650" y="276">Acrylic clear, mist coats,</text><text x="650" y="292">after 24–48 h dry</text>
    <rect x="20" y="256" width="180" height="44" rx="6" fill="#cfd8c0" stroke="#5b7a3a"/>
    <text x="110" y="276">Acrylic or lacquer</text><text x="110" y="292">clear</text>
    <!-- final -->
    <rect x="160" y="330" width="440" height="50" rx="6" fill="#c9a66b"/>
    <text x="380" y="351">Then: pigments, fresh fuel/oil stains and glass</text>
    <text x="380" y="369">go on AFTER the final coat</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="380" y1="92" x2="380" y2="112"/>
    <line x1="510" y1="138" x2="556" y2="138"/>
    <line x1="380" y1="160" x2="380" y2="182"/>
    <line x1="510" y1="208" x2="556" y2="208"/>
    <line x1="380" y1="230" x2="380" y2="252"/>
    <line x1="510" y1="278" x2="556" y2="278"/>
    <line x1="250" y1="278" x2="204" y2="278"/>
    <path d="M650,300 L650,316 L520,316 L520,326"/>
    <path d="M110,300 L110,316 L240,316 L240,326"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="533" y="128" text-anchor="middle">yes</text>
    <text x="533" y="198" text-anchor="middle">yes</text>
    <text x="533" y="268" text-anchor="middle">yes</text>
    <text x="227" y="268" text-anchor="middle">no</text>
    <text x="392" y="176">no</text>
    <text x="392" y="246">no</text>
  </g>
</svg>
